plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.atdev.joynexa.console'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.atdev.joynexa.console'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    sourceSets {
        main {
            assets {
                srcDirs += ["../.."]
                include "index.html", "styles.css", "app.js"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
