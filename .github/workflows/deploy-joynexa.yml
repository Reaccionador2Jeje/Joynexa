name: Deploy Joynexa Website

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-joynexa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joynexa-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN to GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID to GitHub Actions secrets."; exit 1; }

      - uses: actions/checkout@v4

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
