services:
  - type: web
    name: joynexa-accounts
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://joynexa.cristopheriguaran-7.workers.dev
      - key: SESSION_TTL_SECONDS
        value: "1209600"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SETUP_KEY
        generateValue: true
